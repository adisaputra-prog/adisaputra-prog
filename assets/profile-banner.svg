<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adi Saputra — Network QoSE Engineer">
  <defs>
    <style>
      <![CDATA[
        .bg        { fill: #0D1117; }
        .grid-line { stroke: #21262D; stroke-width: 1; }
        .hair      { stroke: #30363D; stroke-width: 1; }
        .brand     { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
        .prompt    { fill: #00FF66; font-size: 15px; letter-spacing: 0.5px; }
        .title     { fill: #C9D1D9; font-size: 40px; font-weight: 700; letter-spacing: 0.5px; }
        .accent    { fill: #00FF66; }
        .role      { fill: #58A6FF; font-size: 18px; font-weight: 500; letter-spacing: 1px; }
        .meta      { fill: #8B949E; font-size: 13px; letter-spacing: 0.5px; }
        .tag       { fill: #0D1117; font-size: 11px; font-weight: 600; }
        .tag-bg    { fill: #FFD54F; }
        .cursor    { fill: #00FF66; animation: blink 1.1s steps(1) infinite; }
        .beam      { animation: sweep 6s linear infinite; }
        .node      { fill: #58A6FF; opacity: 0.55; }
        .node-pulse{ animation: pulse 3.2s ease-in-out infinite; }

        @keyframes blink {
          0%, 45% { opacity: 1; }
          46%, 100% { opacity: 0; }
        }
        @keyframes sweep {
          0%   { transform: translateX(-120px); opacity: 0; }
          8%   { opacity: 0.35; }
          50%  { opacity: 0.1; }
          92%  { opacity: 0.35; }
          100% { transform: translateX(1320px); opacity: 0; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.25; r: 2; }
          50%      { opacity: 0.9; r: 3.4; }
        }

        @media (prefers-reduced-motion: reduce) {
          .cursor, .beam, .node-pulse { animation: none; opacity: 0.6; }
        }
      ]]>
    </style>

    <linearGradient id="fade-edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#0D1117" stop-opacity="1" />
      <stop offset="12%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="88%" stop-color="#0D1117" stop-opacity="0" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="1" />
    </linearGradient>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="260" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="bg" x="0" y="0" width="1200" height="260" />

    <!-- background network grid -->
    <g opacity="0.55">
      <g class="grid-line">
        <line x1="0" y1="30"  x2="1200" y2="30" />
        <line x1="0" y1="80"  x2="1200" y2="80" />
        <line x1="0" y1="130" x2="1200" y2="130" />
        <line x1="0" y1="180" x2="1200" y2="180" />
        <line x1="0" y1="230" x2="1200" y2="230" />
      </g>
      <g class="grid-line">
        <line x1="100"  y1="0" x2="100"  y2="260" />
        <line x1="260"  y1="0" x2="260"  y2="260" />
        <line x1="420"  y1="0" x2="420"  y2="260" />
        <line x1="580"  y1="0" x2="580"  y2="260" />
        <line x1="740"  y1="0" x2="740"  y2="260" />
        <line x1="900"  y1="0" x2="900"  y2="260" />
        <line x1="1060" y1="0" x2="1060" y2="260" />
      </g>
    </g>

    <!-- routed topology accents, right side -->
    <g class="hair" fill="none" opacity="0.8">
      <path d="M 900 210 L 960 210 L 960 170 L 1040 170" />
      <path d="M 1040 170 L 1040 90 L 1120 90" />
      <path d="M 960 170 L 960 60 L 1150 60" />
    </g>
    <g>
      <circle class="node node-pulse" cx="900"  cy="210" style="animation-delay:0s" />
      <circle class="node node-pulse" cx="1040" cy="170" style="animation-delay:0.6s" />
      <circle class="node node-pulse" cx="1120" cy="90"  style="animation-delay:1.2s" />
      <circle class="node node-pulse" cx="960"  cy="60"  style="animation-delay:1.8s" />
      <circle class="node node-pulse" cx="1150" cy="60"  style="animation-delay:2.4s" />
    </g>

    <!-- fade grid at edges so text stays legible -->
    <rect x="0" y="0" width="1200" height="260" fill="url(#fade-edge)" />

    <!-- scanning beam -->
    <rect class="beam" x="0" y="0" width="90" height="260" fill="#00FF66" opacity="0.06" />

    <!-- content -->
    <g class="brand" transform="translate(70, 78)">
      <text class="prompt">root@network:~$ whoami</text>

      <text class="title" y="52">
        Adi <tspan class="accent">Saputra</tspan>
      </text>

      <rect class="cursor" x="428" y="20" width="12" height="32" />

      <text class="role" y="86">NETWORK QoSE ENGINEER</text>

      <text class="meta" y="116">Enterprise Monitoring · MTCNA Certified · Indonesia</text>

      <g transform="translate(0, 136)">
        <rect class="tag-bg" x="0"   y="0" width="118" height="24" rx="3" />
        <text class="tag" x="14" y="16">VELO QoSE PLATFORM</text>
      </g>
    </g>

    <!-- outer hairline border -->
    <rect x="0.5" y="0.5" width="1199" height="259" rx="10" fill="none" stroke="#30363D" />
  </g>
</svg>
