<svg viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adi Saputra — Network QoSE Engineer">
  <defs>
    <style>
      <![CDATA[
        .bg     { fill: #0D1117; }
        .brand  { font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace; }
        .prompt { fill: #00FF66; font-size: 14px; letter-spacing: 0.5px; }
        .title  { fill: #C9D1D9; font-size: 38px; font-weight: 700; letter-spacing: 0.3px; }
        .accent { fill: #00FF66; }
        .role   { fill: #58A6FF; font-size: 16px; font-weight: 500; letter-spacing: 1.5px; }
        .meta   { fill: #8B949E; font-size: 12.5px; letter-spacing: 0.3px; }
        .tag-bg { fill: #FFD54F; }
        .tag    { fill: #0D1117; font-size: 11px; font-weight: 700; letter-spacing: 0.3px; }

        .cursor { fill: #00FF66; animation: blink 1.1s steps(1) infinite; }
        .node   { fill: #58A6FF; }
        .node-a { animation: pulse 3.4s ease-in-out infinite; }

        @keyframes blink {
          0%, 45% { opacity: 1; }
          46%, 100% { opacity: 0; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.35; }
          50%      { opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
          .cursor, .node-a { animation: none; opacity: 0.7; }
        }
      ]]>
    </style>

    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161B22" />
    </pattern>

    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="220" rx="10" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect class="bg" x="0" y="0" width="1200" height="220" />
    <rect x="0" y="0" width="1200" height="220" fill="url(#dotgrid)" opacity="0.7" />

    <!-- primary content -->
    <g class="brand" transform="translate(64, 70)">
      <text class="prompt">root@network:~$ whoami</text>

      <text class="title" y="48">
        Adi <tspan class="accent">Saputra</tspan>
      </text>
      <rect class="cursor" x="392" y="18" width="11" height="30" />

      <text class="role" y="80">NETWORK QoSE ENGINEER</text>
      <text class="meta" y="108">Enterprise Monitoring · MTCNA Certified · Indonesia</text>

      <g transform="translate(0, 126)">
        <rect class="tag-bg" x="0" y="0" width="176" height="24" rx="3" />
        <text class="tag" x="14" y="16">VELO QoSE PLATFORM</text>
      </g>
    </g>

    <!-- single minimal network emblem, right side -->
    <g transform="translate(985, 45)" stroke="#30363D" stroke-width="1.2" fill="none">
      <path d="M 0 65 L 40 65 L 40 30 L 90 30" />
      <path d="M 40 65 L 40 100 L 90 100" />
      <path d="M 90 30 L 130 30" />
      <path d="M 90 100 L 130 100" />
    </g>
    <g fill="#161B22" stroke="#30363D" stroke-width="1.2">
      <circle cx="0" cy="110" r="7" transform="translate(985,45)" />
      <rect x="30" y="20" width="20" height="20" rx="4" transform="translate(985,45)" />
      <rect x="30" y="90" width="20" height="20" rx="4" transform="translate(985,45)" />
    </g>
    <g class="node">
      <circle class="node-a" cx="1115" cy="75" r="4" />
      <circle class="node-a" cx="1115" cy="145" r="4" style="animation-delay:1s" />
    </g>

    <rect x="0.5" y="0.5" width="1199" height="219" rx="10" fill="none" stroke="#21262D" />
  </g>
</svg>
