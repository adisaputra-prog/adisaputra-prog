<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Network topology grid">
  <defs>
    <style>
      <![CDATA[
        .canvas { fill: #0D1117; }
        .grid   { stroke: #21262D; stroke-width: 1; }
        .link   { stroke: #30363D; stroke-width: 1.2; fill: none; }
        .link-active {
          stroke: #00FF66;
          stroke-width: 1.2;
          fill: none;
          stroke-dasharray: 4 7;
          animation: flow 3.5s linear infinite;
          opacity: 0.55;
        }
        .node        { fill: #161B22; stroke: #30363D; stroke-width: 1.2; }
        .node-core   { fill: #00FF66; }
        .node-edge   { fill: #58A6FF; }
        .node-alert  { fill: #FFD54F; }
        .pulse       { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }

        @keyframes flow {
          to { stroke-dashoffset: -22; }
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.5; transform: scale(1); }
          50%      { opacity: 1;   transform: scale(1.25); }
        }

        @media (prefers-reduced-motion: reduce) {
          .link-active, .pulse { animation: none; }
        }
      ]]>
    </style>
    <pattern id="dotgrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1B2129" />
    </pattern>
  </defs>

  <rect class="canvas" width="1200" height="300" />
  <rect width="1200" height="300" fill="url(#dotgrid)" />

  <!-- static grid lines -->
  <g class="grid" opacity="0.5">
    <line x1="0" y1="60"  x2="1200" y2="60" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
    <line x1="1080" y1="0" x2="1080" y2="300" />
  </g>

  <!-- core topology -->
  <g>
    <path class="link" d="M 120 150 L 300 150 L 300 80" />
    <path class="link" d="M 300 150 L 300 220" />
    <path class="link" d="M 300 80 L 460 80" />
    <path class="link" d="M 300 220 L 460 220" />
    <path class="link-active" d="M 460 80 L 620 80 L 620 150" />
    <path class="link-active" d="M 460 220 L 620 220 L 620 150" />
    <path class="link" d="M 620 150 L 800 150" />
    <path class="link-active" d="M 800 150 L 960 150 L 960 70" />
    <path class="link" d="M 800 150 L 960 150 L 960 230" />
    <path class="link" d="M 960 70 L 1100 70" />
    <path class="link" d="M 960 230 L 1100 230" />
  </g>

  <!-- nodes -->
  <g stroke-linecap="round">
    <circle class="node" cx="120" cy="150" r="9" />
    <circle class="node-core pulse" cx="120" cy="150" r="3.5" />

    <rect class="node" x="288" y="68"  width="24" height="24" rx="4" />
    <rect class="node" x="288" y="208" width="24" height="24" rx="4" />

    <circle class="node" cx="460" cy="80"  r="7" />
    <circle class="node" cx="460" cy="220" r="7" />

    <circle class="node" cx="620" cy="150" r="10" />
    <circle class="node-edge pulse" cx="620" cy="150" r="4" style="animation-delay:0.6s" />

    <rect class="node" x="788" y="138" width="24" height="24" rx="4" />

    <circle class="node" cx="960" cy="70"  r="7" />
    <circle class="node-alert pulse" cx="960" cy="70" r="3" style="animation-delay:1.2s" />
    <circle class="node" cx="960" cy="230" r="7" />

    <circle class="node" cx="1100" cy="70"  r="6" />
    <circle class="node" cx="1100" cy="230" r="6" />
  </g>
</svg>
