<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" xmlns:xhtml="http://www.w3.org/1999/xhtml" role="img" aria-label="Terminal boot sequence — Adi Saputra">
  <defs>
    <style>
      <![CDATA[
        .frame  { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
        .chrome { fill: #161B22; stroke: #30363D; stroke-width: 1; }
        .dot    { opacity: 0.9; }

        .term {
          font-family: 'JetBrains Mono', 'IBM Plex Mono', 'Fira Code', monospace;
          font-size: 13.5px;
          line-height: 1.55;
          color: #C9D1D9;
          padding: 18px 22px;
          box-sizing: border-box;
          width: 900px;
          height: 566px;
          overflow: hidden;
        }

        .boot-line {
          opacity: 0;
          white-space: pre;
          animation: reveal 0.4s ease-out forwards;
        }
        .ok    { color: #00FF66; }
        .info  { color: #58A6FF; }
        .warn  { color: #FFD54F; }
        .dim   { color: #6E7681; }

        #l1 { animation-delay: 0.2s; }
        #l2 { animation-delay: 0.9s; }
        #l3 { animation-delay: 1.6s; }
        #l4 { animation-delay: 2.3s; }
        #l5 { animation-delay: 3.0s; }
        #l6 { animation-delay: 3.7s; }
        #l7 { animation-delay: 4.4s; }

        @keyframes reveal {
          from { opacity: 0; transform: translateY(2px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .ascii-wrap {
          opacity: 0;
          animation: reveal 0.6s ease-out forwards;
          animation-delay: 5.2s;
        }
        .ascii {
          color: #00FF66;
          font-size: 4.6px;
          line-height: 1.05;
          white-space: pre;
          transform: scale(1);
          filter: drop-shadow(0 0 1px rgba(0,255,102,0.35));
        }

        .prompt-line {
          opacity: 0;
          animation: reveal 0.4s ease-out forwards;
          animation-delay: 8.6s;
        }
        .cursor {
          display: inline-block;
          width: 8px;
          height: 14px;
          background: #00FF66;
          margin-left: 4px;
          vertical-align: -2px;
          animation: blink 1s steps(1) infinite;
          animation-delay: 9s;
        }
        @keyframes blink {
          0%, 50% { opacity: 1; }
          51%, 100% { opacity: 0; }
        }

        @media (prefers-reduced-motion: reduce) {
          .boot-line, .ascii-wrap, .prompt-line { animation-duration: 0.01s; animation-delay: 0s; opacity: 1; }
          .cursor { animation: none; opacity: 1; }
        }
      ]]>
    </style>
  </defs>

  <!-- window frame -->
  <rect class="frame" x="0.5" y="0.5" width="899" height="619" rx="10" />

  <!-- title bar -->
  <rect class="chrome" x="0.5" y="0.5" width="899" height="38" rx="10" />
  <rect class="chrome" x="0.5" y="28" width="899" height="11" />
  <circle class="dot" cx="24" cy="19" r="5.5" fill="#FF5F56" />
  <circle class="dot" cx="44" cy="19" r="5.5" fill="#FFBD2E" />
  <circle class="dot" cx="64" cy="19" r="5.5" fill="#27C93F" />
  <text x="450" y="24" text-anchor="middle"
        font-family="'JetBrains Mono','IBM Plex Mono',monospace"
        font-size="12" fill="#8B949E">root@network: ~/velo-qose</text>

  <!-- terminal body -->
  <foreignObject x="0" y="39" width="900" height="581">
    <xhtml:div class="term">
      <xhtml:div id="l1" class="boot-line"><xhtml:span class="dim">[    0.114218]</xhtml:span> Initializing Enterprise Network...</xhtml:div>
      <xhtml:div id="l2" class="boot-line"><xhtml:span class="dim">[    0.842011]</xhtml:span> Loading MikroTik Toolkit... <xhtml:span class="info">[MTCNA]</xhtml:span></xhtml:div>
      <xhtml:div id="l3" class="boot-line"><xhtml:span class="dim">[    1.510339]</xhtml:span> Loading Monitoring Engine... <xhtml:span class="info">[VELO QoSE]</xhtml:span></xhtml:div>
      <xhtml:div id="l4" class="boot-line"><xhtml:span class="dim">[    2.203871]</xhtml:span> Loading Python Automation...</xhtml:div>
      <xhtml:div id="l5" class="boot-line"><xhtml:span class="dim">[    2.887654]</xhtml:span> <xhtml:span class="ok">[  OK  ]</xhtml:span> Authentication Successful</xhtml:div>
      <xhtml:div id="l6" class="boot-line"><xhtml:span class="dim">[    3.561209]</xhtml:span> Rendering Profile...</xhtml:div>
      <xhtml:div id="l7" class="boot-line dim">――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――――</xhtml:div>

