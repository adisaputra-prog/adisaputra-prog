<svg viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terminal scanline divider">
  <defs>
    <style>
      <![CDATA[
        .track { stroke: #21262D; stroke-width: 1; }
        .scan  {
          animation: travel 4.5s linear infinite;
        }
        @keyframes travel {
          0%   { transform: translateX(-160px); opacity: 0; }
          10%  { opacity: 1; }
          90%  { opacity: 1; }
          100% { transform: translateX(1360px); opacity: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
          .scan { animation: none; opacity: 0.4; }
        }
      ]]>
    </style>
    <linearGradient id="beam-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00FF66" stop-opacity="0" />
      <stop offset="50%"  stop-color="#00FF66" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>
  </defs>

  <line class="track" x1="0" y1="12" x2="1200" y2="12" />
  <rect class="scan" x="0" y="10" width="160" height="4" fill="url(#beam-grad)" />
</svg>
